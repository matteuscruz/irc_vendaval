version: 1

experiment:
  name: "advanced_lstm_v1"
  seed: 42
  output_dir: "artifacts/experiments"

data:
  path: "dataset/dataset_v2_ML_ready.csv"
  target: "rajada_max_corrigida"
  station_col: "station"
  test_stations: ["A853"]
  train_stations: ["A805", "A854", "A856"]
  drop_cols:
    - "rajada_max_final_ms"
    - "direcao_vento"
    - "latitude_x"
    - "longitude_x"
    - "latitude_y"
    - "longitude_y"
    - "station_lat"
    - "station_lon"

preprocessing:
  temporal_split_ratio: 0.8
  lookback: 14
  imputer_strategy: "median"
  feature_engineering:
    add_month: true
    add_season_dummies: true

model:
  name: "advanced_lstm"
  params:
    lstm_units_1: 256
    lstm_units_2: 128
    conv_filters: 64
    conv_kernel: 3
    attn_heads: 4
    attn_key_dim: 32
    dropout: 0.2
    learning_rate: 0.0001
    clipnorm: 1.0
    weight_mean: 0.7
    weight_extreme: 0.3
    tau: 0.80

training:
  strategy: "standard"
  batch_size: 56
  max_epochs: 1000
  early_stopping:
    monitor: "val_loss"
    patience: 15
    restore_best_weights: true
  reduce_lr:
    monitor: "val_loss"
    factor: 0.5
    patience: 7
    min_lr: 0.000001
  checkpoint:
    enabled: true
    monitor: "val_loss"

losses:
  - name: "dual_head"

validation:
  percentiles: [0.90, 0.95]
  metrics: ["r2", "rmse", "mae", "bias"]

visualization:
  enabled: true
  save_dir: "artifacts/plots"
  plots: ["convergence", "scatter", "violin", "bar_r2", "bar_bias", "tradeoff"]

sweeps:
  enabled: false
  model: ["advanced_lstm"]
  seed: [42]
