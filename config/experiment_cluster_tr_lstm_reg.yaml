version: 1

experiment:
  name: cluster_tr_lstm_reg_v2
  seed: 42
  output_dir: /artifacts/modal/experiments

data:
  raw_dir: /dataset/raw
  shp_dir: /dataset/shp
  target_var: daily_wind_gust_max
  train_slice: ["2008-01-01", "2018-12-31"]
  val_slice:   ["2019-01-01", "2019-12-31"]
  test_slice:  ["2020-01-01", "2025-12-31"]
  test_station_fraction: 0.2

preprocessing:
  lookback: 7

model:
  name: cluster_tr_lstm
  params:
    units: 64
    static_hidden: 32
    dropout: 0.4          # dropout pós-merge (saída do LSTM)
    dropout_static: 0.2   # era 0.05 — branch estático também precisa regularizar
    recurrent_dropout: 0.2  # dropout nas conexões recorrentes do LSTM (novo)
    l2_reg: 0.02          # era 0.01 — aplicado em kernel do LSTM e Dense(16)
    learning_rate: 0.001
    huber_delta: 1.5
    weight_normal: 0.7
    weight_extreme: 0.3
    extreme_weight: 20.0
    extreme_threshold: 1.5

training:
  epochs: 100   # era 50 — regularização atrasa convergência; patience controla
  batch_size: 64
  patience: 15  # era 5 — mais fôlego para o val_loss estabilizar
  min_samples: 10

augmentation:
  method: none

visualization:
  enabled: true
  save_dir: plots
